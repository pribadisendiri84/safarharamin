<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Contoh cover paket umroh">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eb0e8"/>
      <stop offset="45%" stop-color="#9fd4f7"/>
      <stop offset="100%" stop-color="#e8f4fc"/>
    </linearGradient>
    <linearGradient id="sand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67c00"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a67c00"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#fff8e7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- Sun glow -->
  <ellipse cx="980" cy="110" rx="120" ry="120" fill="url(#sun)"/>

  <!-- Distant city silhouette -->
  <path fill="#7a8fa0" opacity=".35" d="M0 340 L80 310 L140 330 L200 295 L260 320 L320 290 L380 315 L440 280 L500 305 L560 275 L620 300 L680 270 L740 295 L800 265 L860 290 L920 270 L980 300 L1040 280 L1100 310 L1200 285 L1200 600 L0 600 Z"/>

  <!-- Ground -->
  <rect x="0" y="380" width="1200" height="220" fill="url(#sand)"/>

  <!-- Courtyard tiles -->
  <g opacity=".12" fill="#013180">
    <rect x="0" y="420" width="60" height="60"/>
    <rect x="120" y="420" width="60" height="60"/>
    <rect x="240" y="420" width="60" height="60"/>
    <rect x="360" y="420" width="60" height="60"/>
    <rect x="480" y="420" width="60" height="60"/>
    <rect x="600" y="420" width="60" height="60"/>
    <rect x="720" y="420" width="60" height="60"/>
    <rect x="840" y="420" width="60" height="60"/>
    <rect x="960" y="420" width="60" height="60"/>
    <rect x="1080" y="420" width="60" height="60"/>
  </g>

  <!-- Kaaba shadow -->
  <ellipse cx="600" cy="520" rx="200" ry="28" fill="#000" opacity=".18" filter="url(#soft)"/>

  <!-- Kaaba body -->
  <rect x="470" y="250" width="260" height="270" rx="4" fill="#1a1404"/>
  <rect x="470" y="250" width="260" height="270" rx="4" fill="#2a2210" opacity=".4"/>

  <!-- Kiswah gold band -->
  <rect x="470" y="390" width="260" height="36" fill="url(#gold)"/>
  <rect x="470" y="390" width="260" height="8" fill="#f0d875" opacity=".45"/>

  <!-- Kaaba door -->
  <rect x="575" y="420" width="50" height="95" rx="2" fill="#c9a227"/>
  <rect x="582" y="430" width="36" height="78" rx="1" fill="#8b6914"/>

  <!-- Minarets (stylized) -->
  <rect x="350" y="180" width="18" height="200" rx="4" fill="#e8edf2"/>
  <rect x="344" y="168" width="30" height="18" rx="4" fill="#d4dce6"/>
  <circle cx="359" cy="162" r="10" fill="#c9a227"/>

  <rect x="832" y="180" width="18" height="200" rx="4" fill="#e8edf2"/>
  <rect x="826" y="168" width="30" height="18" rx="4" fill="#d4dce6"/>
  <circle cx="841" cy="162" r="10" fill="#c9a227"/>

  <!-- Subtle vignette for card polish -->
  <rect width="1200" height="600" fill="url(#sky)" opacity="0"/>
  <rect width="1200" height="600" fill="#013180" opacity=".06"/>
  <rect x="0" y="0" width="1200" height="80" fill="#fff" opacity=".08"/>
</svg>
