<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <title>Layanan terganggu — SafarHaramin</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f4f7fc;color:#14213d;font-family:Inter,system-ui,sans-serif}main{width:min(560px,100%);padding:40px;border:1px solid #dfe6f1;border-radius:24px;background:#fff;text-align:center;box-shadow:0 24px 70px rgba(16,35,70,.12)}img{max-width:220px;max-height:64px;margin-bottom:22px}.code{display:inline-block;padding:6px 12px;border-radius:999px;color:#013180;background:#e9f0fc;font-size:13px;font-weight:800}h1{margin:14px 0 12px;font-size:34px}p{color:#647089;line-height:1.7}.btn{display:inline-flex;margin-top:18px;padding:12px 18px;border-radius:12px;background:#013180;color:#fff;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <img src="/images/logo.webp" alt="SafarHaramin">

    <p>Terjadi gangguan pada server sebelum aplikasi dapat memproses permintaan. Silakan coba kembali beberapa saat.</p>
