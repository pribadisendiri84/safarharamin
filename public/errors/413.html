<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>File terlalu besar — SafarHaramin</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#f4f7fc;color:#14213d;font-family:Inter,system-ui,sans-serif}main{width:min(560px,100%);padding:40px;border:1px solid #dfe6f1;border-radius:24px;background:#fff;text-align:center;box-shadow:0 24px 70px rgba(16,35,70,.12)}img{max-width:220px;max-height:64px;margin-bottom:22px}.code{display:inline-block;padding:6px 12px;border-radius:999px;color:#013180;background:#e9f0fc;font-size:13px;font-weight:800}h1{margin:14px 0 12px;font-size:34px}p{color:#647089;line-height:1.7}.btn{display:inline-flex;margin:18px 4px 0;padding:12px 18px;border:1px solid #013180;border-radius:12px;background:#013180;color:#fff;font-weight:700;text-decoration:none}.btn.alt{background:#fff;color:#013180}
  </style>
</head>
<body>
  <main>
    <img src="/images/logo.webp" alt="SafarHaramin">
    <div><span class="code">ERROR 413</span></div>
    <h1>File atau data terlalu besar</h1>
    <p>Ukuran kiriman melewati batas server. Kembali ke formulir, kecilkan file, lalu coba lagi. Batas aplikasi adalah 5 MB per file.</p>
    <a class="btn" href="/">Ke beranda</a>
    <a class="btn alt" href="javascript:history.back()">Kembali</a>
  </main>
</body>
</html>
